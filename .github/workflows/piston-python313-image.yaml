name: Publish Piston Python 3.13 image

on:
    push:
        branches:
            - master
            - main
            - v3
        paths:
            - api/**
            - packages/Makefile
            - packages/python/3.13.0/**
            - .github/workflows/piston-python313-image.yaml
    workflow_dispatch:
        inputs:
            image_tag:
                description: Extra tag to publish, for example python-3.13-prod
                required: false
                type: string

env:
    IMAGE_NAME: piston
    PYTHON_IMAGE_TAG: python-3.13

jobs:
    build_and_push:
        runs-on: ubuntu-latest
        environment: ${{ matrix.environment }}
        env:
            CONFIGURED_REGISTRY: ${{ vars.PISTON_IMAGE_REGISTRY }}
        strategy:
            fail-fast: false
            matrix:
                environment:
                    - staging
                    - production
        permissions:
            contents: read
            packages: write
            id-token: write
        steps:
            - name: Check out repo
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Configure AWS credentials
              if: vars.AWS_OIDC_ROLE != '' && vars.AWS_REGION != ''
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: ${{ vars.AWS_OIDC_ROLE }}
                  aws-region: ${{ vars.AWS_REGION }}

            - name: Login to Amazon ECR
              if: vars.AWS_OIDC_ROLE != '' && vars.AWS_REGION != ''
              id: ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Login to GHCR
              if: vars.AWS_OIDC_ROLE == '' && (env.CONFIGURED_REGISTRY == '' || env.CONFIGURED_REGISTRY == 'ghcr.io')
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Login to private registry
              if: vars.AWS_OIDC_ROLE == '' && env.CONFIGURED_REGISTRY != '' && env.CONFIGURED_REGISTRY != 'ghcr.io'
              uses: docker/login-action@v3
              with:
                  registry: ${{ vars.PISTON_IMAGE_REGISTRY }}
                  username: ${{ vars.PISTON_IMAGE_REGISTRY_USERNAME }}
                  password: ${{ vars.PISTON_IMAGE_REGISTRY_PASSWORD }}

            - name: Compute image tags
              id: meta
              shell: bash
              env:
                  DEPLOY_ENV: ${{ matrix.environment }}
                  ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
                  CONFIGURED_REGISTRY: ${{ vars.PISTON_IMAGE_REGISTRY }}
                  CONFIGURED_IMAGE: ${{ vars.PISTON_IMAGE_NAME }}
                  MANUAL_IMAGE_TAG: ${{ inputs.image_tag }}
              run: |
                  set -euo pipefail

                  REGISTRY="${CONFIGURED_REGISTRY:-${ECR_REGISTRY:-ghcr.io}}"
                  IMAGE="${CONFIGURED_IMAGE:-${GITHUB_REPOSITORY}/api}"
                  REGISTRY="$(echo "${REGISTRY}" | tr '[:upper:]' '[:lower:]')"
                  IMAGE="$(echo "${IMAGE}" | tr '[:upper:]' '[:lower:]')"

                  STABLE_TAG="${REGISTRY}/${IMAGE}:${PYTHON_IMAGE_TAG}-${DEPLOY_ENV}"
                  SHA_TAG="${REGISTRY}/${IMAGE}:${PYTHON_IMAGE_TAG}-${DEPLOY_ENV}-${GITHUB_SHA::12}"

                  {
                    echo "registry=${REGISTRY}"
                    echo "image=${IMAGE}"
                    echo "tags<<EOF"
                    echo "${STABLE_TAG}"
                    echo "${SHA_TAG}"
                    if [ -n "${MANUAL_IMAGE_TAG}" ]; then
                      echo "${REGISTRY}/${IMAGE}:${MANUAL_IMAGE_TAG}-${DEPLOY_ENV}"
                    fi
                    echo "EOF"
                  } >> "$GITHUB_OUTPUT"

            - name: Build and push image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: api/Dockerfile.python-3.13
                  platforms: linux/amd64
                  pull: true
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  cache-from: type=gha,scope=piston-python313
                  cache-to: type=gha,mode=max,ignore-error=true,scope=piston-python313
